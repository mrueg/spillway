name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Only the release job needs to create the GitHub release.
      contents: write
      # ko pushes the container image to GHCR.
      packages: write
      # Keyless signing exchanges this token with Sigstore for a short-lived
      # certificate, which is what removes the need for a stored private key.
      id-token: write
      # Build provenance for the release artifacts.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      # ko authenticates to GHCR through the Docker config, so log in first.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser shells out to both of these; neither is on the runner.
      #
      # The cosign version is pinned rather than left at the installer default.
      # cosign v3 removed sign-blob's --output-signature and
      # --output-certificate in favour of a single --bundle, so the flags in
      # .goreleaser.yaml are only correct for a known version. Bump this and
      # those args together.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance answers a different question from the cosign signature.
      # The signature says "this release was produced by this workflow"; the
      # attestation records how — which commit, which workflow run, which
      # inputs — and `gh attestation verify` checks it without a key:
      #
      #   gh attestation verify spillway_linux_amd64.tar.gz \
      #     --repo mrueg/spillway
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
